<html lang="fr"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14233B;--ice:#EEF3F8;--paper:#fff;--line:#CBD6E2;--red:#C8102E;--gold:#E7A900;--mut:#5B6B80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6EDF5;--ice:#0F1A2A;--paper:#16233A;--line:#2B3C57;--red:#FF5A6E;--gold:#F2B705;--mut:#9AA9BD}}
:root[data-theme="dark"]{--ink:#E6EDF5;--ice:#0F1A2A;--paper:#16233A;--line:#2B3C57;--red:#FF5A6E;--gold:#F2B705;--mut:#9AA9BD}

*{box-sizing:border-box}
body{margin:0;background:var(--ice);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;letter-spacing:.2px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:3px solid var(--red);background:var(--paper)}
h1{font-size:30px}
main{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
#list{display:flex;flex-direction:column;gap:6px}
.ci{text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);padding:8px 10px;border-radius:4px;color:var(--ink);cursor:pointer;font:inherit;display:flex;flex-direction:column}
.ci.on{border-left-color:var(--red)}.ci span,.mut,small{color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px}
button.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ic{padding:0 6px;border:0;background:none;color:var(--mut)}.pl{display:flex;gap:6px;margin:4px 0}.pl input{flex:1}.sp{border-top:1px solid var(--line);padding:8px 0}.in{margin-left:18px}.pl select{max-width:150px}.pb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0}.pb i{display:block;height:100%;background:var(--red)}.gr{margin:6px 0}.ci[draggable]{cursor:grab}.ci.over{outline:2px dashed var(--red)}
#cl{overflow:auto;position:relative;max-height:70vh;--ttl:#475f7f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #cl{--ttl:#587aa6}}
:root[data-theme="dark"] #cl{--ttl:#587aa6}
#cl .sub>h3{background:var(--ttl);color:#fff;border-radius:6px;padding:3px 10px}
#cl .sub>h3 small{color:rgba(255,255,255,.82)}
.ck thead th.s1,.ck thead th.s2{background:var(--ttl);color:#fff}
.ck{--hl:color-mix(in srgb,var(--ice) 60%,var(--paper));width:auto;border-collapse:separate;border-spacing:0}
.ck th,.ck td{padding:4px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
.ck thead th{position:sticky;top:0;z-index:3;border-bottom:2px solid var(--line);vertical-align:bottom;color:var(--ink)}
.ck .s1,.ck .s2{position:sticky;z-index:2}
.ck .s1{left:0;min-width:50px;max-width:50px}
.ck .s2{left:50px;min-width:170px;max-width:240px;box-shadow:2px 0 0 var(--line)}
.ck thead .s1,.ck thead .s2{z-index:4}
.ck th.pc,.ck td.pc{width:72px;min-width:72px;max-width:72px}
.ck th.pc{font-size:11px;line-height:1.15;overflow-wrap:anywhere;white-space:normal}
.ck tbody tr:hover td,.ck td.hl,.ck th.hl{background:var(--hl)}
.gh{cursor:grab;color:var(--mut);padding:0 4px;user-select:none;align-self:center}.sp.over{outline:2px dashed var(--red);outline-offset:-2px}
.dl{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-top:6px}.dr{display:block;padding:2px 0;cursor:pointer}.dr:hover{background:var(--ice)}.dr small.own{color:var(--red)}
.pv{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.bt{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.sk{width:auto;min-width:min(100%,640px)}.sk .gh td{background:var(--gc);color:var(--gt,#fff);font-weight:700;font-size:13px;padding:3px 8px;border-bottom:0;cursor:pointer;user-select:none}.sk .cv{display:inline-block;width:1em}
.sk tr.sr td{font-size:12px;padding-top:2px;padding-bottom:2px;border-bottom:1px dotted var(--line)}.sk td.sb{padding-left:20px;white-space:nowrap}.sk .tr{color:var(--mut);margin-right:2px}.tg0{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:0 6px}.sk .gh small{color:inherit;opacity:.85;font-weight:400}
.hd{display:flex;gap:12px;align-items:flex-start;min-width:0}.tx{min-width:0}
.av{--s:var(--av,88px);width:var(--s);height:var(--s);flex:none;position:relative;border-radius:12px;background:hsl(var(--h,210) 45% 38%) center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font:700 32px 'Barlow Condensed','Arial Narrow',sans-serif;overflow:hidden}
.av.has span{display:none}.av.sm{--s:40px;border-radius:8px;font-size:16px}
.av .ed{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:50%;padding:0;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;opacity:0;transition:opacity .15s}
.av:hover .ed,.av .ed:focus-visible{opacity:1}@media (hover:none){.av .ed{opacity:1}}
.ci{flex-direction:row;align-items:center;gap:10px}.ci .ct{display:flex;flex-direction:column;min-width:0}.ci .av span{color:#fff;font-size:inherit}.sets{display:inline-flex;gap:3px}.sets button{padding:1px 10px;font-size:13px}.sets button.on{background:var(--red);border-color:var(--red);color:#fff}.st{display:flex;align-items:center;gap:4px}.st button{padding:2px 10px;font-weight:700}.st input.nm{width:56px;text-align:center}.gr label{margin-right:12px;white-space:nowrap}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.vh h2{font-size:28px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0;overflow-x:auto}.tabs button{flex:none}.ml{margin:6px 0;line-height:1.6;word-break:break-word}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-weight:600}
.tabs button.on{border-bottom-color:var(--red)}
.sub{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:12px}
.sub h3{font-size:20px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.tg{font:13px Barlow,sans-serif;margin-left:auto}
.sc{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600}.pc{text-align:center;min-width:64px;user-select:none;-webkit-user-select:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
input,select,textarea{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
input.nm{width:80px}textarea{width:100%;min-height:130px}
label.f{display:block;margin:8px 0 2px;font-weight:600}.f+input,.f+select{width:100%}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:min(520px,94vw);max-height:90vh;overflow:auto}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px}
.box{background:var(--paper);border:1px dashed var(--line);border-radius:6px;padding:20px}
#pa{display:none}
@media (max-width:760px){main{grid-template-columns:1fr}#list{flex-direction:row;overflow-x:auto}.ci{min-width:170px}}
@media print{
:root{padding:0}@page{size:letter;margin:.5in}
body{background:#fff}body>*:not(#pa){display:none!important}
#pa{display:block;color:#000;background:#fff;font-family:Arial,sans-serif}
#pa h1{font-size:16pt}#pa .sb{font-size:9pt;margin-bottom:6px}
#pa h2{font-size:11pt;border-bottom:1px solid #000;margin:10px 0 4px;break-after:avoid}#pa h2.sm{font-size:8.5pt;margin:6px 0 2px;border-bottom-width:.5pt}
.lg{font-size:7.5pt;margin-bottom:3px}.ph{display:flex;gap:12px;align-items:center;margin-bottom:6px}.ph img{width:.85in;height:.85in;object-fit:cover;border-radius:6px;flex:none}.np{break-before:page}.wl{font-size:10pt;margin:5px 0;line-height:1.5}.cp.c1{column-count:1}.bx.on{background:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}th.n{font-size:6pt;font-weight:400;text-align:center;padding:0 1px}
.cp{column-count:3;column-gap:14px;font-size:7.5pt}.cp.c2{column-count:2}
.cp div{break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:inherit}.cp.dd .bx{width:6px;height:6px;line-height:6px;font-size:6px}.cp.dx .bx{width:5px;height:5px;line-height:5px;font-size:5px;margin-right:1px}
.bx{display:inline-block;width:7px;height:7px;border:1px solid #000;margin-right:2px;vertical-align:middle;font:7px/7px Arial;text-align:center;font-style:normal}
.pt{font-size:9pt}.pt th,.pt td{border:1px solid #888;padding:1px 4px;color:#000}
.pt .bx{width:11px;height:11px;line-height:11px;font-size:10px;margin:0}.ctr{text-align:center}
th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:105px;font-weight:400;font-size:8pt}
}

</head><body>
<header><h1>PiCards</h1><div class="bar" style="margin:0"><button class="p" data-a="new">Nouvelle collection</button><button id="gds" data-a="gd">Drive : non connecté</button><button data-a="data">Données</button></div></header>
<main><nav id="list"></nav><section id="view"></section></main>
<dialog id="dlg"></dialog><div id="msg" hidden></div><div id="pa"></div>
<script>
const K='picards.v1';let db={cols:[]},cur=null,tab='chk',delArm=false,arm=null,lastSub='';
try{const s=localStorage.getItem(K);if(s)db=JSON.parse(s)}catch(e){}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const save=()=>{db.updated=Date.now();persist();gdSchedule()};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),money=n=>'$'+(+n||0).toFixed(2);
const MINP=.25,CONDS=['M','NM','EX','VG','G','P'],TYPES={hockey:['Hockey','joueur','équipe'],marvel:['Marvel','personnage','artiste'],autre:['Autre','nom','note']};
const col=()=>db.cols.find(c=>c.id===cur);
const mig=c=>{c.subs.forEach(s=>{if(!s.pars){s.pars=s.par?[...(c.pars||[])]:[];delete s.par}});if(!c.sets){c.sets=[{name:'Set 1',own:c.own||{}}];delete c.own}if(!(c.si>=0&&c.si<c.sets.length))c.si=0;Object.defineProperty(c,'own',{get(){return view(this,this.si)},set(v){this.sets[this.si].own=v},configurable:true})};
const pars=(c,s)=>['Base',...s.pars];
const cardsOf=(c,s)=>c.cards.filter(x=>x.s===s.name).sort((a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true}));
const total=c=>c.subs.reduce((a,s)=>a+cardsOf(c,s).length*pars(c,s).length,0);
function entries(c){const o=[];c.subs.forEach(s=>cardsOf(c,s).forEach(x=>pars(c,s).forEach(p=>{const e=c.own[x.id+'|'+p];if(e)o.push({k:x.id+'|'+p,x,p,s,e})})));return o}
const dbl=c=>entries(c).filter(r=>r.e.q>1);
const tot=c=>{const E=entries(c);return `${E.reduce((a,r)=>a+r.e.q,0)} exemplaires · valeur estimée ${money(E.reduce((a,r)=>a+r.e.q*r.e.p,0))}`};
const nm=r=>`${esc(r.s.name)} #${esc(r.x.n)} ${esc(r.x.m)}${r.p==='Base'?'':' <small>'+esc(r.p)+'</small>'}`;
function armed(t,k){if(arm===k){arm=null;return true}arm=k;t.textContent='Confirmer';t.classList.add('p');return false}
function toast(t){const m=$('#msg');m.textContent=t;m.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>m.hidden=true,2500)}
function renderList(){$('#list').innerHTML=db.cols.map(c=>`<div class="ci ${c.id===cur?'on':''}" data-c="${c.id}" draggable="true" role="button" tabindex="0"><div class="av sm" data-avid="${esc(c.img||'')}" style="--h:${hue(c)}"><span>${ini(c)}</span></div><div class="ct"><b>${esc(c.name)}</b><span>${esc(c.year)} · ${entries(c).length}/${total(c)}</span></div></div>`).join('')||'<p class="mut">Aucune collection.</p>'}
function render(){arm=null;renderList();const c=col(),v=$('#view');
if(!c){v.innerHTML=`<div class="box"><h2>Crée ta première collection</h2><p>Une collection regroupe une série (ex. Young Guns, Marvel Annual), ses sous-séries et ses parallèles.</p><div class="bar"><button class="p" data-a="new">Nouvelle collection</button><button data-a="ex">Charger un exemple</button></div></div>`;return}
const T=TYPES[c.t];
v.innerHTML=`<div class="vh"><div class="hd"><div class="av" data-avid="${esc(c.img||'')}" style="--h:${hue(c)}"><span>${ini(c)}</span><button class="ed" data-a="aved" title="Modifier l’image" aria-label="Modifier l’image">✎</button></div><div class="tx"><h2>${esc(c.name)} — ${esc(c.year)}</h2><div class="mut">${esc(c.brand)} · ${T[0]}</div><div class="mut" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span id="stat">${entries(c).length} / ${total(c)} cases cochées</span><span class="sets">${c.sets.length>1?c.sets.map((z,i)=>`<button data-a="set" data-i="${i}" class="${i===c.si?'on':''}">${esc(z.name)}${z.src!=null?' ↺':''}</button>`).join(''):''}${c.sets.length<3?`<button data-a="aset" title="Ajouter un set (copie séparée de cette collection)" aria-label="Ajouter un set">${c.sets.length>1?'+':'+ Set'}</button>`:''}</span></div></div></div><div class="bar"><button data-a="print">Imprimer la checklist</button></div></div>
<div class="tabs">${[['chk','Checklist'],['add','Ajouter'],['stk','Stock'],['dbl','Doubles'],['mis','Manquantes'],['sta','Stats']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>${tab==='chk'?ctrl(c)+'<div id="cl">'+vChk(c)+'</div>':{add:vAdd,stk:vStock,dbl:vDbl,mis:vMiss,sta:vStats}[tab](c)}`}
function vChk(c){return c.subs.map((s,i)=>{const P=pars(c,s),cs=cardsOf(c,s).filter(x=>show(c,s,x));if(!cs.length&&(flt.q||flt.m!=='all'||flt.s))return '';
return `<div class="sub"><h3>${esc(s.name)} <small>${cs.length} cartes</small></h3><div class="ckw"><table class="ck"><thead><tr><th class="s1">#</th><th class="s2">${esc(s.name)}</th>${P.map(p=>`<th class="pc">${esc(dn(p))}</th>`).join('')}</tr></thead><tbody>${cs.map(x=>`<tr><td class="s1">${esc(x.n)}</td><td class="s2">${esc(x.m)}${x.x?` <small>${esc(x.x)}</small>`:''} <button class="ic" data-a="ecard" data-id="${x.id}" title="Modifier la carte" aria-label="Modifier la carte">✎</button></td>${P.map(p=>{const k=x.id+'|'+p,e=c.own[k];return `<td class="pc"><input type="checkbox" data-k="${k}" ${e?'checked':''} ${e&&e.lk?'disabled title="Vient des doubles du set source"':''} aria-label="${esc(x.m)} ${esc(dn(p))}">${e&&e.q>1?`<sup>×${e.q}</sup>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`}).join('')||'<p>Aucune carte. Va dans l’onglet Ajouter.</p>'}
function vAdd(c){if(dsel.cid!==c.id)Object.assign(dsel,{cid:c.id,sel:new Set(),q:'',sub:''});if(!c.subs.some(z=>z.name===dsel.sub))dsel.sub=(c.subs[0]||{}).name||'';const T=TYPES[c.t];return `<div class="sub"><h3>Ajouter des cartes</h3><label class="f" for="sn">Sous-série</label><select id="sn">${c.subs.map(s=>`<option ${s.name===lastSub?'selected':''}>${esc(s.name)}</option>`).join('')}<option value="__new">+ Nouvelle sous-série…</option></select><input id="sn2" style="margin-top:6px;width:100%" placeholder="Nom de la nouvelle sous-série" ${c.subs.length?'hidden':''}>
<label class="f" for="bt">Une carte par ligne : numéro | ${T[1]} | ${T[2]} (optionnel)</label><textarea id="bt" placeholder="1 | Nom de la carte&#10;2 | Nom de la carte | Note">${esc(pdraft.__bt||'')}</textarea><div class="bar"><button class="p" data-a="addc">Ajouter à la checklist</button></div></div>
<div class="sub"><h3>Retirer des cartes</h3><p class="mut">Coche les cartes à supprimer (Maj + clic pour une plage), puis supprime-les d’un coup. Les cases cochées de ces cartes sont retirées aussi.</p><div class="bar"><select id="ds-s" aria-label="Sous-série">${c.subs.map(z=>`<option ${z.name===dsel.sub?'selected':''}>${esc(z.name)}</option>`).join('')}</select><input id="ds-q" type="search" placeholder="Filtrer (numéro, nom…)" value="${esc(dsel.q)}" aria-label="Filtrer"></div><div class="bar"><button data-a="dsa">Tout sélectionner (affichées)</button><button data-a="dsn">Aucune</button><button class="p" id="dsx" data-a="dsx">Supprimer la sélection (${dsel.sel.size})</button></div><div id="dl" class="dl">${delList(c)}</div></div>
<div class="sub"><h3>Sous-séries et parallèles</h3><p class="mut">Chaque sous-série a ses propres parallèles. Renommer un parallèle conserve les cartes cochées ; le supprimer retire aussi les cases cochées. Supprimer une sous-série retire aussi ses cartes.</p><div class="bar"><button class="p" data-a="apall">Ajouter tous les parallèles saisis</button></div>${c.subs.map((s,si)=>`<div class="sp" data-si="${si}"><div class="pl"><span class="gh" draggable="true" title="Glisser pour réorganiser">⠿</span><input data-sn="${si}" value="${esc(s.name)}" aria-label="Nom de la sous-série"><button class="ic" data-a="sm" data-i="${si}" data-d="-1" aria-label="Monter" title="Monter" ${si?'':'disabled'}>↑</button><button class="ic" data-a="sm" data-i="${si}" data-d="1" aria-label="Descendre" title="Descendre" ${si<c.subs.length-1?'':'disabled'}>↓</button><button data-a="ds" data-i="${si}">Supprimer la sous-série</button></div>${s.pars.map((p,i)=>`<div class="pl in"><input type="color" data-pcl="${esc(p)}" value="${hexOf(pcolor(c,p))}" title="Couleur du parallèle" aria-label="Couleur" style="flex:none;width:34px;height:28px;padding:0;border:0;background:none"><input data-pn="${i}" data-si="${si}" value="${esc(p)}" aria-label="Nom du parallèle"><button class="ic" data-a="mv" data-si="${si}" data-i="${i}" data-d="-1" aria-label="Monter" title="Monter" ${i?'':'disabled'}>↑</button><button class="ic" data-a="mv" data-si="${si}" data-i="${i}" data-d="1" aria-label="Descendre" title="Descendre" ${i<s.pars.length-1?'':'disabled'}>↓</button><button data-a="dp" data-si="${si}" data-i="${i}">Supprimer</button></div>`).join('')}<div class="pl in"><input id="pa-${si}" data-pd="${esc(s.name)}" value="${esc(pdraft[s.name]||'')}" placeholder="Ajouter des parallèles, séparés par des virgules"><button data-a="ap" data-i="${si}">Ajouter</button>${c.subs.length>1?`<select data-cp="${si}" aria-label="Copier les parallèles"><option value="">Copier de…</option>${c.subs.map((z,zi)=>zi===si?'':`<option value="${zi}">${esc(z.name)}</option>`).join('')}</select>`:''}</div></div>`).join('')||'<p class="mut">Aucune sous-série.</p>'}</div>
<div class="sub"><h3>Collection</h3><p class="mut">Sets (3 maximum) : chaque set a ses propres cases cochées, quantités et prix.</p>${c.sets.map((z,i)=>`<div class="pl"><input data-nm="${i}" value="${esc(z.name)}" aria-label="Nom du set"><button data-a="dset" data-i="${i}" ${c.sets.length<2?'disabled':''}>Supprimer</button></div>`).join('')}<div class="bar"><button data-a="ec">Modifier les informations</button><button data-a="del">Supprimer la collection</button></div></div>`}
function dblTable(c){const D=dbl(c),par=sf.g==='p',M=new Map();
D.forEach(r=>{const k=par?r.p:r.s.name;if(!M.has(k))M.set(k,{key:k,rows:[],n:0,v:0});const g=M.get(k);g.rows.push(r);g.n+=r.e.q-1;g.v+=(r.e.q-1)*r.e.p});
const G=[...M.values()],cs=par?7:6,vals=r=>`<td>${r.e.q-1}</td><td>${esc(r.e.c)}</td><td>${money(r.e.p)}</td>`;
const flat=r=>`<tr><td><span class="bt" style="background:${bcol(r.s.name)}">${esc(r.s.name)}</span></td><td>${esc(r.x.n)}</td><td>${esc(r.x.m)}${r.x.x?` <small>${esc(r.x.x)}</small>`:''}</td><td>${pill(c,r.p)}</td>${vals(r)}</tr>`;
const nested=rows=>{const out=[];let i=0;while(i<rows.length){const x=rows[i].x,gr=[];while(i<rows.length&&rows[i].x.id===x.id)gr.push(rows[i++]);const b=gr.find(r=>r.p==='Base');
out.push(`<tr class="cr"><td>${esc(x.n)}</td><td>${esc(x.m)}${x.x?` <small>${esc(x.x)}</small>`:''}</td><td>${b?'<span class="tg0">Base</span>':''}</td>${b?vals(b):'<td></td><td></td><td></td>'}</tr>`);
gr.filter(r=>r.p!=='Base').forEach(r=>out.push(`<tr class="sr"><td></td><td class="sb"><span class="tr">╰</span> ${pill(c,r.p)}</td><td></td>${vals(r)}</tr>`))}return out.join('')};
return`<table class="sk"><thead><tr>${par?'<th>Bloc</th>':''}<th>#</th><th>Joueur</th><th>Version</th><th>Doubles</th><th>Cond.</th><th>Prix</th></tr></thead><tbody>${G.map(g=>{const col=par?pcolor(c,g.key):bcol(g.key),off=sf.col['d|'+g.key];return`<tr class="gh" data-a="gt" data-gk="d|${esc(g.key)}" style="--gc:${col};--gt:${ink(hexOf(col))}"><td colspan="${cs}"><span class="cv">${off?'▸':'▾'}</span><span>${esc(g.key)}</span> <small class="gs">· ${g.n} double(s) · ${money(g.v)}</small></td></tr>`+(off?'':par?g.rows.map(flat).join(''):nested(g.rows))}).join('')}</tbody></table>`}

h+='</section>'});return h}

function avEdit(c){AV={img:null,ox:0,oy:0,z:1,w:1,h:1,base:1};
dlg(`<h3>Image de la collection</h3><input type="file" id="avf" accept="image/*"><div style="margin:10px 0"><canvas id="avc" width="240" height="240" style="width:240px;height:240px;max-width:100%;border-radius:12px;background:var(--ice);touch-action:none;cursor:grab"></canvas></div><label class="f" for="avz">Zoom</label><input type="range" id="avz" min="1" max="3" step="0.01" value="1" style="width:100%"><p class="mut">Glisse l’image pour la cadrer.</p><div class="bar"><button class="p" data-a="avs">Enregistrer</button>${c.img?'<button data-a="avr">Retirer l’image</button>':''}</div>`);
$('#avf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{AV.img=im;AV.w=im.naturalWidth;AV.h=im.naturalHeight;AV.base=Math.max(240/AV.w,240/AV.h);AV.z=1;$('#avz').value=1;AV.ox=(240-AV.w*AV.base)/2;AV.oy=(240-AV.h*AV.base)/2;avDraw()};im.src=URL.createObjectURL(f)};
$('#avz').oninput=e=>{if(!AV.img)return;const o=AV.base*AV.z,cx=(120-AV.ox)/o,cy=(120-AV.oy)/o;AV.z=+e.target.value;const n=AV.base*AV.z;AV.ox=120-cx*n;AV.oy=120-cy*n;avDraw()};
const cv=$('#avc');let last=null;
cv.onpointerdown=e=>{last=[e.clientX,e.clientY];try{cv.setPointerCapture(e.pointerId)}catch(x){}};
cv.onpointermove=e=>{if(!last||!AV.img)return;const k=240/cv.clientWidth;AV.ox+=(e.clientX-last[0])*k;AV.oy+=(e.clientY-last[1])*k;last=[e.clientX,e.clientY];avDraw()};
cv.onpointerup=cv.onpointercancel=()=>{last=null};avDraw()}
async function avSave(c,retry){if(!AV||!AV.img){toast('Choisis une image');return}
if(!ls('picards.cid')){toast('Connecte d’abord Google Drive (bouton Drive)');return}
const tk=getToken().catch(e=>e),sc=AV.base*AV.z,o=document.createElement('canvas');o.width=o.height=256;
o.getContext('2d').drawImage(AV.img,-AV.ox/sc,-AV.oy/sc,240/sc,240/sc,0,0,256,256);
const toB=t=>new Promise(r=>o.toBlob(r,t,.85));let b=await toB('image/webp');if(!b||b.type!=='image/webp')b=await toB('image/jpeg');
try{const t=await tk;if(t instanceof Error)throw t;toast('Envoi de l’image…');const id=await avUp(c,b),old=c.img;c.img=id;await idbPut(id,b);if(old)avDel(old);save();$('#dlg').close();render();toast('Image enregistrée')}
catch(e){if(e.message==='Drive 404'&&!retry){ls('picards.gd.imgdir',null);return avSave(c,true)}toast(e.message==='auth'?'Connexion Google nécessaire : réessaie':'Échec de l’envoi : '+e.message)}}
let paint=null,pdirty=false,skipClick=false;
const cellIn=(x,y)=>{const el=document.elementFromPoint(x,y),td=el&&el.closest('td.pc');return td&&td.querySelector('input[data-k]:not(:disabled)')};
function paintBox(i,on,first){const c=col(),k=i.dataset.k,e=c.own[k];
if(on){if(e)return;c.own[k]={q:1,c:'NM',p:MINP};i.checked=true}
else{if(!e||(!first&&e.q>1))return;delete c.own[k];i.checked=false;const s=i.nextElementSibling;if(s)s.remove()}
pdirty=true}
function endPaint(){if(!paint)return;paint=null;setTimeout(()=>skipClick=false,50);if(pdirty){pdirty=false;const c=col();save();renderList();$('#stat').textContent=`${entries(c).length} / ${total(c)} cases cochées`}}
document.addEventListener('pointerdown',e=>{if(e.button!==0||e.pointerType==='touch'||!col())return;const i=cellIn(e.clientX,e.clientY);if(!i)return;paint={on:!i.checked};skipClick=true;paintBox(i,paint.on,true)});
document.addEventListener('pointermove',e=>{if(!paint)return;const i=cellIn(e.clientX,e.clientY);if(i)paintBox(i,paint.on,false)});
document.addEventListener('pointerup',endPaint);document.addEventListener('pointercancel',endPaint);window.addEventListener('blur',endPaint);
document.addEventListener('mousedown',e=>{const td=e.target.closest('td.pc');if(td&&td.querySelector('input[data-k]'))e.preventDefault()});
document.addEventListener('click',e=>{if(skipClick&&e.target.closest('td.pc')){e.preventDefault();e.stopPropagation()}skipClick=false},true);
if(db.cols.length)cur=db.cols[0].id;render();gdStatus(gdOn()?'cliquer pour reconnecter':'non connecté');
</script></body></html>
